{% extends "app_base.html" %}
{% block title %}Đổi mật khẩu — Bestone Console{% endblock %}
{% block content %}
<h1 class="mb-4 text-xl font-bold">Đổi mật khẩu</h1>
<div class="max-w-md rounded-lg bg-white p-6 shadow">
  {% if error %}
  <p class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>
  {% endif %}
  {% if success %}
  <p class="mb-4 rounded border border-green-200 bg-green-50 px-3 py-2 text-sm text-green-700" role="status">{{ success }}</p>
  {% endif %}
  <form method="post" action="/account/change-password" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div>
      <label for="current_password" class="mb-1 block text-sm font-medium">Mật khẩu hiện tại</label>
      <input id="current_password" name="current_password" type="password" required autocomplete="current-password"
             class="w-full rounded border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label for="new_password" class="mb-1 block text-sm font-medium">Mật khẩu mới</label>
      <input id="new_password" name="new_password" type="password" required autocomplete="new-password"
             class="w-full rounded border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label for="confirm_password" class="mb-1 block text-sm font-medium">Nhập lại mật khẩu mới</label>
      <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password"
             class="w-full rounded border border-gray-300 px-3 py-2">
    </div>
    <button type="submit" class="w-full rounded bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800">Đổi mật khẩu</button>
  </form>
</div>
{% endblock %}
