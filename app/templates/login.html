{% extends "base.html" %}
{% block title %}Đăng nhập — Bestone Console{% endblock %}
{% block body %}
<main class="flex min-h-screen items-center justify-center px-4 py-8">
  <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow sm:p-8">
    <h1 class="mb-6 text-center text-lg font-bold">C.G. Engineering — Bestone Console</h1>
    {% if error %}
    <p class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="space-y-4" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div>
        <label for="username" class="mb-1 block text-sm font-medium">Tên đăng nhập</label>
        <input id="username" name="username" type="text" required autofocus autocomplete="username"
               class="w-full rounded border border-gray-300 px-3 py-2 focus:border-blue-600 focus:outline-none">
      </div>
      <div>
        <label for="password" class="mb-1 block text-sm font-medium">Mật khẩu</label>
        <div class="relative">
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 class="w-full rounded border border-gray-300 px-3 py-2 pr-16 focus:border-blue-600 focus:outline-none">
          <button type="button" id="toggle-password" aria-label="Hiện hoặc ẩn mật khẩu"
                  class="absolute inset-y-0 right-0 px-3 text-sm text-gray-600">Hiện</button>
        </div>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="remember_me" class="h-4 w-4">
        Ghi nhớ đăng nhập
      </label>
      <button type="submit"
              class="w-full rounded bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800">Đăng nhập</button>
    </form>
    <p class="mt-4 text-center text-xs text-gray-500">Quên mật khẩu? Liên hệ Giám đốc</p>
  </div>
</main>
<script>
  (function () {
    var btn = document.getElementById("toggle-password");
    var input = document.getElementById("password");
    btn.addEventListener("click", function () {
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.textContent = show ? "Ẩn" : "Hiện";
    });
  })();
</script>
{% endblock %}
