# Standalone throwaway Postgres for pytest (TEST_DATABASE_URL). Never touches production data:
# separate project name, no named volume (tmpfs), own port 5433.
#   up:   docker compose -f deploy/docker-compose.test.yml up -d db_test
#   down: docker compose -f deploy/docker-compose.test.yml down
#   URL:  postgresql+psycopg://test:test@localhost:5433/bestone_test
name: bestone-test
services:
  db_test:
    image: postgres:16.4
    environment:
      POSTGRES_DB: bestone_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d bestone_test"]
      interval: 5s
      timeout: 5s
      retries: 10
