[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestone-agents"
version = "0.2.0"
description = "Bestone desktop agents for Facebook Fanpage management"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "tzdata",
    "anthropic>=1.0",
    "google-genai",
    "beautifulsoup4",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "respx", "ruff", "mypy", "types-PyYAML", "types-beautifulsoup4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
