[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestone-agents"
version = "0.1.0"
description = "Bestone AI agents for Facebook Fanpage management"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3.1",
    "pydantic-settings",
    "jinja2",
    "python-multipart",
    "argon2-cffi",
    "httpx",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "respx", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
python_version = "3.12"
strict = true
